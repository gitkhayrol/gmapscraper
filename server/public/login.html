<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GMapScraper Pro — Login</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: #0a0a0f;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #e8e8f0;
    }
    .card {
      background: #111118;
      border: 1px solid #2a2a3a;
      border-radius: 16px;
      padding: 40px 36px;
      width: 100%; max-width: 380px;
      box-shadow: 0 24px 64px rgba(0,0,0,.6);
    }
    .logo {
      text-align: center;
      margin-bottom: 32px;
    }
    .logo-icon {
      width: 56px; height: 56px;
      background: linear-gradient(135deg, #00e5ff, #7c3aed);
      border-radius: 14px;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 28px;
      margin-bottom: 12px;
      box-shadow: 0 0 24px rgba(0,229,255,.25);
    }
    .logo h1 {
      font-size: 22px; font-weight: 800; letter-spacing: -.5px;
      background: linear-gradient(90deg, #00e5ff, #a78bfa);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .logo p { font-size: 12px; color: #6b7280; margin-top: 4px; }
    .field { margin-bottom: 16px; }
    label { display: block; font-size: 12px; color: #9ca3af; margin-bottom: 6px; font-weight: 600; letter-spacing: .3px; }
    input {
      width: 100%;
      background: #16161f; border: 1px solid #2a2a3a; color: #e8e8f0;
      padding: 10px 14px; border-radius: 8px; font-size: 14px;
      outline: none; transition: border-color .2s, box-shadow .2s;
    }
    input:focus { border-color: #00e5ff; box-shadow: 0 0 0 3px rgba(0,229,255,.1); }
    .btn {
      width: 100%; padding: 12px;
      background: linear-gradient(135deg, #00e5ff, #7c3aed);
      color: #fff; border: none; border-radius: 8px;
      font-size: 15px; font-weight: 700; cursor: pointer;
      margin-top: 8px; transition: opacity .2s, transform .1s;
    }
    .btn:hover { opacity: .9; transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .error {
      background: rgba(239,68,68,.1); border: 1px solid #ef4444;
      color: #fca5a5; border-radius: 8px; padding: 10px 14px;
      font-size: 13px; margin-bottom: 16px; display: none;
    }
    .error.show { display: block; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-icon">🗺️</div>
      <h1>GMapScraper Pro</h1>
      <p>Web Control Portal</p>
    </div>
    <div class="error" id="errBox">Invalid username or password.</div>
    <div class="field">
      <label>USERNAME</label>
      <input type="text" id="uname" placeholder="admin" autocomplete="username">
    </div>
    <div class="field">
      <label>PASSWORD</label>
      <input type="password" id="pass" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn" id="loginBtn">Sign In →</button>
  </div>

  <script>
    const uname = document.getElementById('uname');
    const pass  = document.getElementById('pass');
    const errBox = document.getElementById('errBox');

    async function login() {
      const username = uname.value.trim();
      const password = pass.value;
      if (!username || !password) return;

      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();

      if (data.ok) {
        // Store WS token and go to dashboard
        sessionStorage.setItem('wsToken', data.token);
        location.href = '/dashboard.html';
      } else {
        errBox.classList.add('show');
        pass.value = '';
        pass.focus();
      }
    }

    document.getElementById('loginBtn').addEventListener('click', login);
    pass.addEventListener('keydown', e => e.key === 'Enter' && login());
    uname.addEventListener('keydown', e => e.key === 'Enter' && pass.focus());

    // Auto-focus
    uname.focus();
  </script>
</body>
</html>
